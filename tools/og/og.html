<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f7f7f8;color:#1a1a1e;position:relative}
  .card{position:absolute;inset:40px;background:#fff;border:1px solid #e3e3e7;border-radius:22px;padding:52px 60px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:30px}
  .kicker{font-size:22px;letter-spacing:3px;color:#2f6f4e;font-weight:600}
  .url{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:19px;white-space:nowrap;color:#8a8a94}
  h1{font-size:76px;line-height:1.16;letter-spacing:-2px;font-weight:700;margin-top:18px}
  h1 em{font-style:normal;color:#2f6f4e}
  .sub{font-size:30px;color:#55555e;line-height:1.55;margin-top:24px}
  .row{display:flex;gap:14px;align-items:center}
  .chip{font-size:21px;white-space:nowrap;color:#2f6f4e;background:#e8f1ec;border-radius:999px;padding:10px 22px}
  .chip.g{color:#8a8a94;background:#f1f1f3}
  .note{margin-left:auto;font-size:19px;white-space:nowrap;color:#8a8a94}
  .bar{position:absolute;left:40px;right:40px;bottom:40px;height:6px;background:linear-gradient(90deg,#2f6f4e 0 25%,#9a7b1f 25% 45%,#8a8a94 45% 100%);border-radius:0 0 22px 22px;opacity:.85}
</style></head>
<body>
  <div class="card">
    <div>
      <div class="top">
        <div class="kicker">按性价比排序 · 开源</div>
        <div class="url">github.com/gengyueworks/ai-work-guide</div>
      </div>
      <h1>AI 时代<br>高性价比<em>工作指南</em></h1>
      <div class="sub">每一条都回答两个问题：<b>花掉什么</b>，<b>换回什么</b>。<br>来源只引论文原文与官方文件，看不懂的数字有一行「说人话」。</div>
    </div>
    <div class="row">
      <span class="chip">换时间</span><span class="chip">换钱</span><span class="chip">换职业安全</span><span class="chip">换人身自由</span>
      <span class="chip g">Unlicense 公有领域</span>
      <span class="note">离线单文件版 · 双击就开</span>
    </div>
  </div>
  <div class="bar"></div>
</body></html>
