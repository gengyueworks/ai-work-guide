<script>
const COST_ENUMS={钱:["0","少","多"],时间:["少","中","多"],毅力:["否","些","是"],收益:["大","中","小"],口径:["时间","钱","职业","自由"]};
// PDF 构建注入 __PRINT__：折叠的 <details> 在打印时不会展开，细字（成本/收益/来源）会整块从 PDF 里消失。
const PRINT=window.__PRINT__===true;
addEventListener("beforeprint",()=>document.querySelectorAll("details").forEach(d=>d.open=true));
const LENS_LABEL={时间:"时间与精力",钱:"金钱与保障",职业:"职业安全",自由:"人身自由与法律安全"};
const COST_KEYS=["钱","时间","毅力"];
// 与 tools/lib/book.mjs 的 TODO_RE 保持一致：三种坦白写法都算「有未核实事项」。
const TODO_RE=/待核实|未核到|未取到/;
// ratioOf 必须与 tools/lib/book.mjs 中的同名函数保持一致，改一处要改两处。
function ratioOf(t){if(!t||!t.收益)return null;const zero=COST_KEYS.every(k=>k==="钱"?t[k]==="0":(t[k]==="少"||t[k]==="否"));const cheap=COST_KEYS.reduce((n,k)=>(t[k]==="中"||t[k]==="些"?n+1:n),0);if(t.收益==="大"&&zero)return"极高";if((t.收益==="大"&&cheap<=1)||(t.收益==="中"&&zero))return"高";return"一般";}
const TAG_RE=/^<!--\s*成本标签:\s*(.*?)\s*-->$/;
const ENTRY_RE=/^###\s+(\d+)\.\s+(.+)$/;
const FIELD_RE=/^- \*\*(.+?)\*\*[:：]\s*(.*)$/;
const BARE_RE=/^- (成本|说人话|收益|证据等级|来源|备注)[:：]\s*(.*)$/;
const FIELDS=["成本","说人话","收益","证据等级","来源","备注"];

function parseTag(line){const m=TAG_RE.exec(line.trim());if(!m)return null;const t={};for(const p of m[1].split(/\s+/).filter(Boolean)){const i=p.indexOf("=");if(i<0)continue;const k=p.slice(0,i),v=p.slice(i+1);if(k==="适合"){t[k]=v.split("|").filter(Boolean);continue;}t[k]=v;}return t;}

// 与 tools/lib/book.mjs 的 pickIntro() 同算法：h1 后第一段正文（blockquote 或裸段落）。
function pickIntro(lines,h1Idx){
  for(const raw of lines.slice(h1Idx+1)){
    const s=raw.trim();
    if(!s)continue;
    if(s.startsWith("#"))break;
    if(s.startsWith(">"))return s.replace(/^>\s*/,"").trim();
    if(s.startsWith("[")||s.startsWith("-")||s.startsWith("<!--"))continue;
    return s;
  }
  return "";
}

function parseMd(text,file){
  const lines=text.split(/\r?\n/);
  const h1=lines.find(l=>l.startsWith("# "));
  const title=h1?h1.slice(2).replace(/^\d+\.\s*/,"").trim():file;
  const intro=pickIntro(lines,h1?lines.indexOf(h1):-1);
  const out=[];let cur=null,last=null;
  const close=()=>{if(cur)out.push(cur);cur=null;last=null;};
  lines.forEach((raw,i)=>{
    const line=raw.trimEnd();
    const em=ENTRY_RE.exec(line.trim());
    if(em){close();cur={number:+em[1],title:em[2].trim(),file,line:i+1,tags:null,raw:{}};return;}
    if(!cur)return;
    const tg=parseTag(line);if(tg){cur.tags=tg;return;}
    const fm=FIELD_RE.exec(line.trim())||BARE_RE.exec(line.trim());
    if(fm&&FIELDS.includes(fm[1])){last=fm[1];cur.raw[last]=fm[2].trim();return;}
    if(last&&line.trim()&&!line.trim().startsWith("- ")){cur.raw[last]+="\n"+line.trim();}
  });
  close();
  out.sort((a,b)=>a.number-b.number);
  return{file,title,intro,entries:out.map(e=>({...e,ratio:ratioOf(e.tags),grade:(e.raw["证据等级"]||"").trim()[0]}))};
}

const EMBED = typeof window.__CORPUS__!=="undefined";

// 站点配置与广告位全部来自 tools/site.json + tools/ads.json，在线模式下运行时抓取。
// 换推广只改那两个 json，index.html 永不改动；离线单文件里两者由 window.__SITE__ 注入。
const SITE = Object.assign(
  { canonical: location.href.replace(/[^/]*$/,""), repo: "", release: "", license: "Unlicense，公有领域", longDocs: [], ads: [] },
  window.__SITE__ || {}
);
async function loadSite(){
  if(EMBED) return;
  try{
    const cfg=await (await fetch("tools/site.json")).json();
    Object.assign(SITE,cfg.site);
    SITE.longDocs=cfg.longDocs||[];
    const ads=await (await fetch("tools/ads.json")).json();
    SITE.ads=ads.slots||[];
  }catch(e){
    console.warn("tools/site.json / tools/ads.json 读取失败，侧栏推广与页脚长文留空",e);
  }
}

// 在线模式：不维护硬编码文件清单，运行时从 README 的目录表解析 book/ 链接。
// 这样新增一节只要写 book/NN-名.md 加 README 一行，index.html 永不改动。
async function fileList(){
  const r=await fetch("README.md");
  if(!r.ok) throw new Error("README.md 读取失败 "+r.status);
  const md=await r.text();
  const hrefs=[...md.matchAll(/book\/(\d{2}-[^\s)\]]+\.md)/g)].map(m=>m[1]);
  const uniq=[...new Set(hrefs)];
  if(!uniq.length) throw new Error("README 目录里没解析到 book/NN-名.md，跑 node tools/sync-stats.mjs 生成");
  return uniq.map(n=>"book/"+n);
}

async function load(){
  if(EMBED) return window.__CORPUS__;
  const files=await fileList();
  const rs=await Promise.all(files.map(async f=>{
    const r=await fetch(f);
    if(!r.ok) throw new Error(f+" 读取失败 "+r.status);
    return parseMd(await r.text(),f);
  }));
  return rs.sort((a,b)=>a.file.localeCompare(b.file));
}

const S={q:"",ch:"",适合:new Set(),钱:new Set(),时间:new Set(),毅力:new Set(),口径:new Set(),ratio:new Set(),grade:new Set(),dispute:false,todo:false};

function seg(id,key,vals){
  const el=document.getElementById(id);
  el.innerHTML=vals.map(v=>`<button type="button" data-v="${v}" aria-pressed="false">${v}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const v=b.dataset.v;S[key].has(v)?S[key].delete(v):S[key].add(v);b.setAttribute("aria-pressed",S[key].has(v));render();});
}
function has(text,needle){return (text||"").indexOf(needle)>=0;}
function match(e){
  if(S.ch&&e.file!==S.ch)return false;
  if(S.适合.size&&!(e.tags?.适合||[]).some(r=>S.适合.has(r)))return false;
  if(S.钱.size&&!S.钱.has(e.tags?.钱))return false;
  if(S.时间.size&&!S.时间.has(e.tags?.时间))return false;
  if(S.毅力.size&&!S.毅力.has(e.tags?.毅力))return false;
  if(S.口径.size&&!S.口径.has(e.tags?.口径))return false;
  if(S.ratio.size&&!S.ratio.has(e.ratio))return false;
  if(S.grade.size&&!S.grade.has(e.grade))return false;
  const blob=Object.values(e.raw).join(" ")+e.title;
  if(S.dispute&&!has(blob,"争议"))return false;
  if(S.todo&&!TODO_RE.test(blob))return false;
  if(S.q){const qs=S.q.split(/\s+/).filter(Boolean);if(!qs.every(x=>has(blob,x)))return false;}
  return true;
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function linkify(s,hereSec){
  s=esc(s);
  s=s.replace(/第\s*(\d+)\s*节\s*第\s*(\d+)\s*条(?:（[^）)]{1,26}）)?|第\s*(\d+)\s*条(?:（[^）)]{1,26}）)?/g,(m,crossSec,no,aSec,aNo)=>{
    const sec=crossSec!==undefined?+crossSec:hereSec;
    const n=crossSec!==undefined?+no:+aNo;
    const t=byKey.get(sec+":"+n)??(sec===hereSec?byKey.get(n+""):undefined);
    if(!t)return m;
    // 只显示「第 N 节第 M 条」+ 解析出的真实标题：作者写的锚点若已漂移，渲染出的仍是目标当前标题。
    const label=m.replace(/（[^）)]{1,26}）$/,"");
    return `<button class="xref" data-ref="${sec}:${n}">${label}<span style="color:var(--t3);font-size:12px">（${esc(t.title)}）</span></button>`;
  });
  s=s.replace(/(https?:\/\/[^\s<）)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  // 正文里的 **强调** 与 `行内代码` 一直是原样吐星号的；esc 已跑过，这里只会新增标签，不会注入。
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  return s;
}
function chip(t,v,cls){return v?`<span class="chip ${cls||""}">${t}${v}</span>`:"";}

function render(){
  const out=document.getElementById("out");
  let shown=0;const html=[];
  for(const c of CORPUS){
    const sec=Number(c.file.replace("book/","").slice(0,2))||0;
    const es=c.entries.filter(match);
    shown+=es.length;
    if(!es.length)continue;
    html.push(`<div class="sec-h"><h2>${esc(c.title)}</h2><span class="shown">${es.length} / ${c.entries.length} 条</span></div>`);
    if(c.intro&&!S.q)html.push(`<p class="intro">${linkify(c.intro,sec)}</p>`);
    for(const e of es){
      const blob=Object.values(e.raw).join(" ")+" "+(e.tags?.适合||[]).join(" ");
      const L=(x)=>linkify(x,sec);
      html.push(`<article class="card" id="${e.file.replace(/\W/g,"")}-${e.number}">
        <h3><span class="no">${e.number}.</span>${L(e.title)}</h3>
        ${e.raw["说人话"]?`<p class="plain">${L(e.raw["说人话"])}</p>`:""}
        <div class="chips">
          ${(e.tags?.适合||[]).length?`<span class="chip role">写给 ${e.tags.适合.join(" · ")}</span>`:""}
          ${chip("性价比 ",e.ratio,"ratio-"+e.ratio)}
          ${chip("证据 ",e.grade,"g-"+e.grade)}
          ${chip("花钱 ",e.tags?.钱)}${chip("时间 ",e.tags?.时间)}${chip("毅力 ",e.tags?.毅力)}
          ${chip("换回 ",e.tags?LENS_LABEL[e.tags.口径]||e.tags.口径:"")}
          ${has(blob,"争议")?'<span class="chip warn">有争议</span>':""}
          ${TODO_RE.test(blob)?'<span class="chip warn">待核实</span>':""}
        </div>
        <details class="fine"${PRINT?" open":""}><summary>成本 · 收益 · 来源 · 备注</summary>
          <p><b>成本：</b>${L(e.raw["成本"])}</p>
          <p><b>收益：</b>${L(e.raw["收益"])}</p>
          <p><b>来源：</b>${L(e.raw["来源"])}</p>
          <p><b>备注：</b>${L(e.raw["备注"])}</p>
        </details>
      </article>`);
    }
  }
  out.innerHTML=shown?html.join(""):`<div class="empty">没有符合条件的条目。<br>试着少勾几个筛选项。</div>`;
  document.getElementById("stat").textContent=shown+" 条";
  document.getElementById("head-stat").textContent=`共 ${TOTAL} 条建议 · ${CORPUS.length} 节 · A 级 ${G.A} 条 · 性价比极高 ${R.极高} 条`;
}

function showPop(btn){
  document.querySelector(".pop")?.remove();
  const key=btn.dataset.ref;const [,no]=key.split(":");
  const cur=CORPUS.find(c=>c.file===S.ch)||CORPUS[0];
  const target=byKey.get(key)||cur?.entries.find(e=>String(e.number)===no);
  if(!target)return;
  const p=document.createElement("div");p.className="pop";
  p.innerHTML=`<button class="close" aria-label="关闭">×</button><h3 style="font-size:15px;margin:0 0 8px">${esc(target.title)}</h3><p class="plain" style="margin:0 0 8px">${esc(target.raw["说人话"]||"")}</p><p style="margin:0;color:var(--t3);font-size:12.5px">来自 ${esc(target.file)}</p>`;
  document.body.appendChild(p);
  const r=btn.getBoundingClientRect();
  p.style.left=Math.min(r.left,innerWidth-440)+"px";
  p.style.top=(r.bottom+8)+"px";
  p.querySelector(".close").onclick=()=>p.remove();
}

let CORPUS=[],byKey=new Map(),TOTAL=0,G={A:0,B:0,C:0},R={极高:0,高:0,一般:0};
async function init(){
  const [corpus]=await Promise.all([load(),loadSite()]);
  CORPUS=corpus;
  TOTAL=CORPUS.reduce((n,c)=>n+c.entries.length,0);
  for(const c of CORPUS)for(const e of c.entries){
    const sec=Number(c.file.replace("book/","").slice(0,2))||0;
    byKey.set(sec+":"+e.number,e);
    if(!byKey.has(String(e.number)))byKey.set(String(e.number),e);
    if(e.grade)G[e.grade]=(G[e.grade]||0)+1;
    if(e.ratio)R[e.ratio]=(R[e.ratio]||0)+1;
  }
  const sel=document.getElementById("f-ch");
  sel.innerHTML=`<option value="">全部（${TOTAL} 条）</option>`+CORPUS.map(c=>`<option value="${c.file}">${esc(c.title)}（${c.entries.length}）</option>`).join("");
  sel.onchange=()=>{S.ch=sel.value;render();};
  seg("f-money","钱",COST_ENUMS.钱);seg("f-time","时间",COST_ENUMS.时间);seg("f-grit","毅力",COST_ENUMS.毅力);
  seg("f-lens","口径",COST_ENUMS.口径.map(v=>v));seg("f-ratio","ratio",["极高","高","一般"]);seg("f-grade","grade",["A","B","C"]);
  // 身份选项从正文里长出来：条目写了 适合= 才会出现，避免筛出一个 0 条的空身份。
  const roleCnt=new Map();
  for(const c of CORPUS)for(const e of c.entries)for(const r of e.tags?.适合||[])roleCnt.set(r,(roleCnt.get(r)||0)+1);
  if(roleCnt.size){
    document.getElementById("g-role").hidden=false;
    seg("f-role","适合",[...roleCnt.keys()].sort((a,b)=>roleCnt.get(b)-roleCnt.get(a)||a.localeCompare(b,"zh")));
  }
  document.getElementById("f-q").oninput=e=>{S.q=e.target.value.trim();render();};
  document.getElementById("f-dispute").onchange=e=>{S.dispute=e.target.checked;render();};
  document.getElementById("f-todo").onchange=e=>{S.todo=e.target.checked;render();};
  document.getElementById("reset").onclick=()=>{S.q="";S.ch="";["适合","钱","时间","毅力","口径","ratio","grade"].forEach(k=>S[k].clear());S.dispute=S.todo=false;
    document.getElementById("f-q").value="";document.getElementById("f-ch").value="";document.getElementById("f-dispute").checked=false;document.getElementById("f-todo").checked=false;
    document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed","false"));
    render();};
  document.getElementById("nav-repo").href=SITE.repo;
  document.getElementById("nav-dl").href=SITE.release;
  document.getElementById("ads").innerHTML=(SITE.ads||[]).map(a=>`<div class="group ad"><p class="gt">${esc(a.label||"推广")} · ${esc(a.title)}</p><a href="${esc(a.href)}" target="_blank" rel="noopener"><img src="${esc(a.src)}" alt="${esc(a.alt||a.title)}" width="624" height="312" onerror="this.closest('.ad').style.display='none'"></a></div>`).join("");
  const extra=(SITE.longDocs||[]).length?`长文：${SITE.longDocs.map(d=>`<a href="${esc(d.href)}">${esc(d.text)}</a>`).join(" · ")}。`:"";
  document.getElementById("foot").innerHTML=`数字口径以条目内标注为准：时间与金钱不换算，见前言四种资源。${extra}来源核实过程见 <a href="${SITE.repo}/tree/main/docs">docs/</a>。正文每天都在改，以在线版为准：<a href="${SITE.canonical}">${SITE.canonical.replace(/^https?:\/\//,"")}</a>。${esc("Unlicense，公有领域")}。`;
  document.body.addEventListener("click",e=>{const b=e.target.closest(".xref");if(b)showPop(b);});
  document.getElementById("toggle-side").onclick=()=>document.body.classList.toggle("open");
  document.getElementById("backdrop").onclick=()=>document.body.classList.remove("open");
  const q0=new URLSearchParams(location.search).get("q");
  if(q0){S.q=q0;document.getElementById("f-q").value=q0;}
  render();
}
init().catch(err=>{
  document.getElementById("out").innerHTML=`<div class=empty>加载失败：${String(err&&err.message||err)}<br>正文需要经 http 打开，双击本地文件会被浏览器拦下——那种场景请用离线单文件版。</div>`;
  console.error(err);
});
</script>
